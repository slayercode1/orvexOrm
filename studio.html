<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrvexORM Studio</title>
<style nonce="{{NONCE}}">
/* ─── Tokens ─────────────────────────────────────────────────────── */
:root {
    --bg: #0b0c0e;
    --surface: #101114;
    --raised: #16171b;
    --hairline: rgba(255,255,255,0.06);
    --hairline-strong: rgba(255,255,255,0.1);
    --text: #ececee;
    --text-2: #9a9ca3;
    --text-3: #75777f;
    --text-disabled: #4c4e55;
    --accent: #34d399;
    --accent-strong: #6ee7b7;
    --accent-dim: rgba(52,211,153,0.1);
    --accent-glow: rgba(52,211,153,0.35);
    --danger: #f87171;
    --danger-dim: rgba(248,113,113,0.1);
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-xl: 14px;
    --shadow-modal: 0 24px 64px -16px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3);
    --shadow-toast: 0 12px 32px -8px rgba(0,0,0,0.5);
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --t-fast: 120ms;
    --t-med: 180ms;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }
body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

button { cursor: pointer; border: none; background: none; font-family: inherit; font-size: 13px; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 13px; color: var(--text); }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); border: 2px solid transparent; background-clip: padding-box; }

.icon { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ─── Header ─────────────────────────────────────────────────────── */
.header {
    height: 52px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--hairline);
    flex: none;
}
.header .menu-toggle { display: none; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: var(--r-md); color: var(--text-2); }
.header .menu-toggle:hover { background: var(--raised); color: var(--text); }
.header .logo { display: flex; align-items: center; gap: 10px; }
.header .logo-mark {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
}
.header .logo-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.header h1 { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
.header h1 .thin { color: var(--text-3); font-weight: 450; }
.header .conn {
    margin-left: auto;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
}
.header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); flex: none; }

/* ─── Layout ─────────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; min-height: 0; }

/* ─── Sidebar ────────────────────────────────────────────────────── */
.sidebar {
    width: 248px;
    flex: none;
    display: flex;
    flex-direction: column;
    padding: 16px 10px 12px;
    gap: 4px;
    background: var(--bg);
}
.sidebar-search { padding: 0 6px 10px; }
.sidebar-search input {
    width: 100%;
    padding: 7px 12px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.sidebar-search input::placeholder { color: var(--text-3); }
.sidebar-search input:hover { background: var(--raised); }
.sidebar-search input:focus { border-color: var(--accent); background: var(--raised); }
.sidebar-label {
    padding: 6px 14px 6px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
}
.table-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.table-item {
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: var(--r-md);
    color: var(--text-2);
    text-align: left;
    width: 100%;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.table-item:hover { background: var(--surface); color: var(--text); }
.table-item.active { background: var(--accent-dim); color: var(--accent-strong); }
.table-item .t-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 480; }
.table-item.active .t-name { font-weight: 560; }
.table-item .t-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--text-3);
}
.table-item.active .t-count { color: var(--accent); }
.sidebar-empty { padding: 10px 14px; color: var(--text-3); font-size: 12px; }

/* ─── Main ───────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border-left: 1px solid var(--hairline); }

.page-head { padding: 22px 28px 0; flex: none; }
.page-title { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; font-family: var(--font-mono); }
.page-head-row { display: flex; align-items: flex-start; gap: 16px; }
.page-head-row .spacer { flex: 1; }

.tabs { display: flex; gap: 20px; margin-top: 14px; }
.tab {
    padding: 0 0 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    position: relative;
    transition: color var(--t-fast) var(--ease);
}
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); }
.tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: var(--accent);
}
.tabs-rule { border-bottom: 1px solid var(--hairline); margin: 0 28px; flex: none; }

/* ─── Buttons ────────────────────────────────────────────────────── */
.btn {
    padding: 7px 14px;
    border-radius: var(--r-md);
    font-size: 12.5px;
    font-weight: 550;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #08130e; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-primary .icon svg { stroke-width: 2.25; }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--raised); color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-dim); }

/* ─── Filter bar ─────────────────────────────────────────────────── */
.filter-bar {
    padding: 12px 28px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex: none;
    flex-wrap: wrap;
}
.filter-bar select, .filter-bar input {
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    transition: border-color var(--t-fast) var(--ease);
}
.filter-bar select:hover, .filter-bar input:hover { border-color: var(--hairline-strong); }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--accent); }
.filter-bar input::placeholder { color: var(--text-3); }
.filter-bar select { color: var(--text-2); }
.filter-bar .f-active { color: var(--accent); font-size: 12px; display: none; align-items: center; gap: 6px; }
.filter-bar .f-active.show { display: inline-flex; }

/* ─── Data grid ──────────────────────────────────────────────────── */
.grid-wrapper { flex: 1; overflow: auto; min-height: 0; }
table.grid { width: 100%; border-collapse: collapse; }
.grid thead { position: sticky; top: 0; z-index: 1; }
.grid th {
    background: var(--surface);
    padding: 9px 16px;
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-3);
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    box-shadow: inset 0 -1px 0 var(--hairline);
    transition: color var(--t-fast) var(--ease);
}
.grid th > button { color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
.grid th:first-child { padding-left: 28px; }
.grid th:hover { color: var(--text-2); }
.grid th.sorted { color: var(--accent); }
.grid th .sort-ind { margin-left: 5px; font-size: 9px; }
.grid td {
    padding: 9px 16px;
    border-bottom: 1px solid var(--hairline);
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-2);
}
.grid td:first-child { padding-left: 28px; color: var(--text); }
.grid tbody tr { cursor: pointer; transition: background var(--t-fast) var(--ease); }
.grid tbody tr:hover { background: var(--raised); }
.grid td .null-val { color: var(--text-disabled); font-style: italic; }
.grid td .json-val { color: var(--accent); opacity: 0.6; }
.grid td.row-actions { width: 44px; padding: 4px 16px 4px 4px; }
.grid .action-btn {
    width: 28px; height: 28px;
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease), background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.grid tbody tr:hover .action-btn, .grid .action-btn:focus-visible { opacity: 1; }
.grid .action-btn:hover { background: var(--danger-dim); color: var(--danger); }
.grid .action-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Skeleton loading */
@keyframes shimmer { 0% { opacity: 0.35; } 50% { opacity: 0.7; } 100% { opacity: 0.35; } }
.skel-row td { padding: 12px 16px; }
.skel-row td:first-child { padding-left: 28px; }
.skel { display: block; height: 10px; border-radius: 5px; background: var(--raised); animation: shimmer 1.4s var(--ease) infinite; }

@keyframes rowsIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.grid tbody.fade-in tr { animation: rowsIn var(--t-med) var(--ease) both; }
.grid tbody.fade-in tr:nth-child(n+2)  { animation-delay: 15ms; }
.grid tbody.fade-in tr:nth-child(n+4)  { animation-delay: 30ms; }
.grid tbody.fade-in tr:nth-child(n+7)  { animation-delay: 45ms; }
.grid tbody.fade-in tr:nth-child(n+11) { animation-delay: 60ms; }

/* ─── Schema view ────────────────────────────────────────────────── */
.schema-view { padding: 8px 28px 28px; overflow: auto; flex: 1; }
.schema-view table { width: 100%; border-collapse: collapse; }
.schema-view th {
    padding: 9px 16px 9px 0;
    text-align: left;
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-3);
    border-bottom: 1px solid var(--hairline);
}
.schema-view td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; color: var(--text-2); }
.schema-view td:first-child { color: var(--text); font-weight: 550; font-family: var(--font-mono); }
.schema-view .type-badge { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); background: var(--bg); padding: 2px 8px; border-radius: var(--r-sm); }
.schema-view .pk-badge { font-size: 10.5px; font-weight: 650; letter-spacing: 0.05em; color: var(--accent); }
.schema-view .null-val { color: var(--text-disabled); font-style: italic; }

/* ─── Pagination ─────────────────────────────────────────────────── */
.pagination {
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-top: 1px solid var(--hairline);
    flex: none;
    flex-wrap: wrap;
}
.pagination .info { color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.pagination select {
    padding: 4px 8px;
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    font-size: 12px;
    color: var(--text-2);
    transition: border-color var(--t-fast) var(--ease);
}
.pagination select:hover { border-color: var(--hairline-strong); }
.pagination .pages { display: flex; gap: 2px; margin-left: auto; }
.pagination .page-btn {
    min-width: 30px; height: 30px;
    padding: 0 6px;
    border-radius: var(--r-sm);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.pagination .page-btn:hover:not(.active):not(.disabled) { background: var(--raised); color: var(--text); }
.pagination .page-btn.active { background: var(--accent-dim); color: var(--accent-strong); font-weight: 600; }
.pagination .page-btn.disabled { opacity: 0.3; pointer-events: none; }
.pagination .page-dots { color: var(--text-disabled); display: flex; align-items: center; padding: 0 4px; }
.pagination .page-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ─── Modal ──────────────────────────────────────────────────────── */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(6,7,8,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 24px;
    animation: fadeIn var(--t-med) var(--ease);
}
.modal {
    background: var(--raised);
    border: 1px solid var(--hairline);
    border-radius: var(--r-xl);
    width: 520px;
    max-width: 100%;
    max-height: 86vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-modal);
    animation: modalIn var(--t-med) var(--ease);
}
.modal.narrow { width: 400px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { transform: translateY(8px) scale(0.99); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.modal-header h2 .mono { font-family: var(--font-mono); color: var(--accent); }
.modal-close { width: 30px; height: 30px; border-radius: var(--r-md); color: var(--text-3); display: flex; align-items: center; justify-content: center; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.modal-close:hover { background: var(--surface); color: var(--text); }
.modal-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
.modal-body { padding: 18px 24px 8px; overflow-y: auto; flex: 1; }
.modal-body .confirm-text { color: var(--text-2); font-size: 13px; padding-bottom: 12px; }
.modal-footer { padding: 14px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }
.modal-footer .btn-ghost { border: 1px solid var(--hairline); }
.modal-footer .btn-danger-solid { background: var(--danger); color: #190a0a; padding: 7px 14px; border-radius: var(--r-md); font-size: 12.5px; font-weight: 550; }
.modal-footer .btn-danger-solid:hover { filter: brightness(1.1); }

.form-group { margin-bottom: 14px; }
.form-group label { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 550; margin-bottom: 6px; color: var(--text-2); }
.form-group label .type-hint { color: var(--text-3); font-weight: 400; font-family: var(--font-mono); font-size: 11px; }
.form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    transition: border-color var(--t-fast) var(--ease);
}
.form-group input:hover, .form-group select:hover, .form-group textarea:hover { border-color: var(--hairline-strong); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.form-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.filter-bar .filter-value { width: 180px; }
.btn.btn-compact { padding: 2px 8px; }
.grid th.actions-head { cursor: default; }
[hidden] { display: none !important; }
.form-group .auto-tag { display: inline-block; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 3px 0; }

/* ─── Toast ──────────────────────────────────────────────────────── */
.toast {
    position: fixed;
    bottom: 20px; right: 20px;
    padding: 10px 16px;
    border-radius: var(--r-lg);
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-size: 12.5px;
    font-weight: 500;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: var(--shadow-toast);
    animation: toastIn var(--t-med) var(--ease);
}
.toast svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.toast.success svg { color: var(--accent); }
.toast.error svg { color: var(--danger); }
.toast.leaving { animation: toastOut var(--t-med) var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }

/* ─── Empty / loading states ─────────────────────────────────────── */
.empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1;
    gap: 6px;
    padding: 48px 24px;
    text-align: center;
}
.empty svg { width: 36px; height: 36px; stroke: var(--text-disabled); fill: none; stroke-width: 1.25; margin-bottom: 8px; }
.empty .e-title { font-size: 13.5px; font-weight: 550; color: var(--text-2); }
.empty .e-hint { font-size: 12.5px; color: var(--text-3); }

/* ─── Responsive ─────────────────────────────────────────────────── */
.sidebar-backdrop { display: none; }
@media (max-width: 860px) {
    .header { padding: 0 14px; }
    .header .menu-toggle { display: flex; }
    .header .conn { display: none; }
    .sidebar {
        position: fixed;
        top: 52px; bottom: 0; left: 0;
        z-index: 60;
        background: var(--bg);
        border-right: 1px solid var(--hairline);
        transform: translateX(-100%);
        transition: transform var(--t-med) var(--ease);
    }
    .sidebar.open { transform: none; }
    .sidebar-backdrop.show {
        display: block;
        position: fixed; inset: 52px 0 0 0;
        z-index: 50;
        background: rgba(6,7,8,0.4);
    }
    .main { border-left: none; }
    .page-head { padding: 16px 16px 0; }
    .tabs-rule { margin: 0 16px; }
    .filter-bar { padding: 10px 16px; }
    .grid th:first-child, .grid td:first-child { padding-left: 16px; }
    .pagination { padding: 10px 16px; }
    .schema-view { padding: 8px 16px 16px; }
}
</style>
</head>
<body>

<header class="header">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle table list" data-action="toggle-sidebar">
        <span class="icon"><svg viewBox="0 0 24 24"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg></span>
    </button>
    <div class="logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></span>
        <h1>Orvex <span class="thin">Studio</span></h1>
    </div>
    <span class="conn"><span class="dot" aria-hidden="true"></span><span id="connInfo">connecting…</span></span>
</header>

<div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" data-action="toggle-sidebar"></div>
    <nav class="sidebar" id="sidebar" aria-label="Tables">
        <div class="sidebar-search">
            <input type="text" id="tableSearch" placeholder="Filter tables…" aria-label="Filter tables">
        </div>
        <div class="sidebar-label">Tables</div>
        <div class="table-list" id="tableList" role="list"></div>
    </nav>
    <main class="main" id="mainArea">
        <div class="empty">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            <span class="e-title">Select a table</span>
            <span class="e-hint">Pick a table from the list to browse its rows.</span>
        </div>
    </main>
</div>

<template id="mainAreaTemplate">
        <div class="page-head">
            <div class="page-head-row">
                <div>
                    <div class="page-title"></div>
                    <div class="tabs" role="tablist">
                        <button class="tab active" id="tabData" role="tab" aria-selected="true" data-action="show-tab" data-tab="data">Data</button>
                        <button class="tab" id="tabSchema" role="tab" aria-selected="false" data-action="show-tab" data-tab="schema">Schema</button>
                    </div>
                </div>
                <div class="spacer"></div>
                <button class="btn btn-primary" data-action="add-row">
                    <span class="icon"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
                    Add row
                </button>
            </div>
        </div>
        <div class="tabs-rule"></div>
        <div class="filter-bar" id="filterBar">
            <select id="filterCol" aria-label="Filter column"><option value="">Filter by…</option></select>
            <select id="filterOp" aria-label="Filter operator"><option value="=">=</option><option value="!=">&ne;</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&ge;</option><option value="<=">&le;</option><option value="LIKE">contains</option><option value="IS NULL">is null</option><option value="IS NOT NULL">is not null</option></select>
            <input type="text" id="filterVal" class="filter-value" placeholder="Value…" aria-label="Filter value">
            <button class="btn btn-ghost" data-action="apply-filter">Apply</button>
            <span class="f-active" id="filterActive">
                <span>filtered</span>
                <button class="btn btn-ghost btn-compact" data-action="clear-filter">Clear</button>
            </span>
        </div>
        <div class="grid-wrapper" id="gridWrapper"></div>
        <div class="pagination" id="pagination"></div>
</template>

<script nonce="{{NONCE}}">
(() => {
'use strict';

// The token travels in the initial URL only; it is moved into this closure
// and removed from the address bar, then sent as the X-Studio-Token header.
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const BASE = location.pathname.replace(/\/$/, '');
if (TOKEN) history.replaceState(null, '', location.pathname);
let currentTable = null, currentSchema = null, currentPK = null;
let currentPage = 1, currentPerPage = 25, currentSort = null, currentDir = 'asc';
let currentLastPage = 1;
let allTables = [], currentRows = [];

class ApiError extends Error {
    constructor(error, status) {
        const reference = error.errorId ? ` Reference: ${error.errorId}.` : '';
        super((error.message || 'The request could not be completed.') + reference);
        this.code = error.code || 'NETWORK_ERROR';
        this.errorId = error.errorId;
        this.retryable = Boolean(error.retryable);
        this.status = status;
    }
}

async function api(p, o = {}, attempt = 0) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    const method = (o.method || 'GET').toUpperCase();
    try {
        const response = await fetch(BASE + p, {
            ...o,
            signal: controller.signal,
            headers: { 'Content-Type': 'application/json', 'X-Studio-Token': TOKEN, ...o.headers },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.success === false) throw new ApiError(payload.error || {}, response.status);
        return payload;
    } catch (error) {
        const normalized = error instanceof ApiError ? error : new ApiError({
            code: error.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK_ERROR',
            message: error.name === 'AbortError'
                ? 'The request took too long. Please try again.'
                : 'The server could not be reached. Check your connection and try again.',
            retryable: true,
        }, 0);
        if (method === 'GET' && normalized.retryable && attempt === 0) return api(p, o, 1);
        toast(normalized.message, 'error', normalized.errorId || normalized.code);
        throw normalized;
    } finally {
        clearTimeout(timeout);
    }
}

/* ─── DOM helpers ───────────────────────────────────────────────── */

// Builds an element without parsing HTML: values land in properties
// (value, checked, dataset…) so row data can never become markup.
function h(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null) continue;
        if (key === 'dataset') Object.assign(node.dataset, value);
        else if (key in node) node[key] = value;
        else node.setAttribute(key, String(value));
    }
    node.append(...children.flat().filter(child => child !== null && child !== undefined && child !== false));
    return node;
}

// Parses one trusted, static SVG from ICONS. Never pass data here:
// database values only ever reach the page through h() and textContent.
function svg(markup) {
    const template = document.createElement('template');
    template.innerHTML = markup;
    return template.content.firstElementChild;
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

const ICONS = {
    success: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    close: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    emptyTable: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    previous: '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
    next: '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
};

function emptyState(title, hint, iconMarkup) {
    return h('div', { className: 'empty' }, iconMarkup ? svg(iconMarkup) : null,
        h('span', { className: 'e-title' }, title),
        h('span', { className: 'e-hint' }, hint));
}

/* ─── Toast ─────────────────────────────────────────────────────── */

const visibleToasts = new Map();

function toast(msg, type = 'success', dedupeKey = `${type}:${msg}`) {
    if (visibleToasts.has(dedupeKey)) return;
    const el = h('div', { className: 'toast ' + type, role: 'status' }, svg(ICONS[type] || ICONS.error), String(msg));
    document.body.appendChild(el);
    visibleToasts.set(dedupeKey, el);
    const duration = type === 'error' ? 6000 : 2800;
    setTimeout(() => { el.classList.add('leaving'); setTimeout(() => { el.remove(); visibleToasts.delete(dedupeKey); }, 200); }, duration);
}

/* ─── Sidebar ───────────────────────────────────────────────────── */

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
}
function closeSidebarMobile() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
}

async function loadTables() {
    try {
        const d = await api('/api/tables');
        allTables = d.tables || [];
        renderTables(allTables);
        const connection = await api('/api/connection');
        document.getElementById('connInfo').textContent = connection.connected ? 'database connected' : 'database unavailable';
    } catch (error) {
        document.getElementById('connInfo').textContent = 'database unavailable';
    }
}

function renderTables(tables) {
    const list = document.getElementById('tableList');
    list.replaceChildren();
    if (!tables.length) {
        list.append(h('div', { className: 'sidebar-empty' }, 'No matching table.'));
        return;
    }
    tables.forEach(t => {
        const count = h('span', { className: 't-count' }, '·');
        const el = h('button', { className: 'table-item' + (t === currentTable ? ' active' : ''), role: 'listitem' },
            h('span', { className: 't-name' }, String(t)), count);
        el.addEventListener('click', () => { selectTable(t); closeSidebarMobile(); });
        list.appendChild(el);
        api('/api/tables/' + encodeURIComponent(t) + '/count').then(d => {
            count.textContent = d.count ?? '·';
        }).catch(() => {});
    });
}

function filterTables() {
    const q = document.getElementById('tableSearch').value.toLowerCase();
    renderTables(allTables.filter(t => String(t).toLowerCase().includes(q)));
}

/* ─── Table selection / layout ──────────────────────────────────── */

async function selectTable(name) {
    try {
        currentTable = name; currentPage = 1; currentSort = null;
        filterTables();
        const sd = await api('/api/tables/' + encodeURIComponent(name) + '/schema');
        currentSchema = sd.schema || [];
        currentPK = null;
        for (const c of currentSchema) if (c.Key === 'PRI') { currentPK = c.Field; break; }
        renderMainArea();
        await loadRows();
    } catch (error) {
        currentTable = null;
    }
}

function renderMainArea() {
    const main = document.getElementById('mainArea');
    main.replaceChildren(document.getElementById('mainAreaTemplate').content.cloneNode(true));
    main.querySelector('.page-title').textContent = String(currentTable);
    const sel = document.getElementById('filterCol');
    currentSchema.forEach(c => sel.appendChild(h('option', { value: c.Field }, String(c.Field))));
    renderSkeleton();
}

/* ─── Data grid ─────────────────────────────────────────────────── */

function renderSkeleton() {
    const cols = Math.min(6, Math.max(3, (currentSchema || []).length));
    const body = h('tbody');
    for (let r = 0; r < 8; r++) {
        const row = h('tr', { className: 'skel-row' });
        for (let c = 0; c < cols; c++) {
            const bar = h('span', { className: 'skel' });
            bar.style.width = (40 + ((r * 7 + c * 13) % 60)) + 'px';
            row.append(h('td', {}, bar));
        }
        body.append(row);
    }
    document.getElementById('gridWrapper').replaceChildren(h('table', { className: 'grid', 'aria-hidden': 'true' }, body));
}

async function loadRows() {
    try {
        renderSkeleton();
        const p = new URLSearchParams({ page: currentPage, perPage: currentPerPage });
        if (currentSort) { p.set('sort', currentSort); p.set('dir', currentDir); }
        const fc = document.getElementById('filterCol'), fo = document.getElementById('filterOp'), fv = document.getElementById('filterVal');
        if (fc && fc.value) { p.set('filter_col', fc.value); p.set('filter_op', fo.value); p.set('filter_val', fv.value); }
        const d = await api('/api/tables/' + encodeURIComponent(currentTable) + '/rows?' + p.toString());
        renderGrid(d.rows || [], d.total || 0);
    } catch (error) {
        document.getElementById('gridWrapper').replaceChildren(emptyState('Unable to load rows', 'Check the connection, then try again.'));
    }
}

function gridHeader(cols) {
    return h('thead', {}, h('tr', {},
        cols.map((c, index) => {
            const sorted = currentSort === c;
            const indicator = sorted ? (currentDir === 'asc' ? '▲' : '▼') : '';
            const ariaSort = sorted ? (currentDir === 'asc' ? 'ascending' : 'descending') : 'none';
            return h('th', { className: sorted ? 'sorted' : '', 'aria-sort': ariaSort },
                h('button', { dataset: { action: 'sort', colIndex: index } }, String(c),
                    h('span', { className: 'sort-ind' }, indicator)));
        }),
        h('th', { className: 'actions-head', 'aria-hidden': 'true' })));
}

function gridCell(value) {
    if (value === null || value === undefined) return h('td', {}, h('span', { className: 'null-val' }, 'null'));
    if (typeof value === 'object') return h('td', {}, h('span', { className: 'json-val' }, JSON.stringify(value)));
    return h('td', {}, String(value));
}

function rowActions(rowIndex) {
    return h('td', { className: 'row-actions' },
        h('button', { className: 'action-btn', 'aria-label': 'Edit row', dataset: { action: 'edit-row', rowIndex } }, svg(ICONS.edit)),
        h('button', { className: 'action-btn', 'aria-label': 'Delete row', dataset: { action: 'delete-row', rowIndex } }, svg(ICONS.trash)));
}

function renderGrid(rows, total) {
    currentRows = rows;
    const w = document.getElementById('gridWrapper');
    if (!rows.length) {
        const filtered = document.getElementById('filterCol') && document.getElementById('filterCol').value;
        w.replaceChildren(emptyState(
            'No rows' + (filtered ? ' match this filter' : ''),
            filtered ? 'Adjust or clear the filter to see more.' : 'Use “Add row” to insert the first one.',
            ICONS.emptyTable));
        document.getElementById('pagination').replaceChildren();
        return;
    }
    const cols = currentSchema.map(c => c.Field);
    const body = h('tbody', { className: 'fade-in' },
        rows.map((row, idx) => h('tr', {}, cols.map(c => gridCell(row[c])), rowActions(idx))));
    w.replaceChildren(h('table', { className: 'grid' }, gridHeader(cols), body));
    renderPagination(total);
    const fa = document.getElementById('filterActive');
    const fc = document.getElementById('filterCol');
    if (fa && fc) fa.classList.toggle('show', !!fc.value);
}

function pageRange(lastPage) {
    const range = [];
    if (lastPage <= 7) {
        for (let i = 1; i <= lastPage; i++) range.push(i);
        return range;
    }
    range.push(1);
    if (currentPage > 3) range.push('…');
    for (let i = Math.max(2, currentPage - 1); i <= Math.min(lastPage - 1, currentPage + 1); i++) range.push(i);
    if (currentPage < lastPage - 2) range.push('…');
    range.push(lastPage);
    return range;
}

function pageButton(content, page, { active = false, disabled = false, label } = {}) {
    const className = 'page-btn' + (active ? ' active' : '') + (disabled ? ' disabled' : '');
    return h('button', { className, disabled, 'aria-label': label, dataset: { action: 'go-page', page } }, content);
}

function renderPagination(total) {
    const lp = Math.max(1, Math.ceil(total / currentPerPage));
    currentLastPage = lp;
    const perPage = h('select', { 'aria-label': 'Rows per page', dataset: { action: 'per-page' } },
        [10, 25, 50, 100].map(n => h('option', { value: n }, n + ' / page')));
    perPage.value = String(currentPerPage);
    const info = h('div', { className: 'info' }, h('span', {}, Number(total) + ' row' + (total === 1 ? '' : 's')), perPage);
    const pages = h('div', { className: 'pages' },
        pageButton(svg(ICONS.previous), currentPage - 1, { disabled: currentPage <= 1, label: 'Previous page' }),
        pageRange(lp).map(p => p === '…'
            ? h('span', { className: 'page-dots' }, '…')
            : pageButton(String(p), p, { active: p === currentPage })),
        pageButton(svg(ICONS.next), currentPage + 1, { disabled: currentPage >= lp, label: 'Next page' }));
    document.getElementById('pagination').replaceChildren(info, pages);
}

function sortBy(c) {
    if (currentSort === c) currentDir = currentDir === 'asc' ? 'desc' : 'asc';
    else { currentSort = c; currentDir = 'asc'; }
    loadRows();
}
function goPage(p) { if (p < 1 || p > currentLastPage) return; currentPage = p; loadRows(); }
function changePerPage(v) { currentPerPage = parseInt(v, 10); currentPage = 1; loadRows(); }
function applyFilter() { currentPage = 1; loadRows(); }
function clearFilter() {
    document.getElementById('filterCol').value = '';
    document.getElementById('filterVal').value = '';
    currentPage = 1;
    loadRows();
}

/* ─── Tabs ──────────────────────────────────────────────────────── */

const SCHEMA_HEADINGS = ['Column', 'Type', 'Nullable', 'Key', 'Default', 'Extra'];

function schemaRow(c) {
    return h('tr', {},
        h('td', {}, String(c.Field)),
        h('td', {}, h('span', { className: 'type-badge' }, String(c.Type))),
        h('td', {}, String(c.Null || '')),
        h('td', {}, c.Key === 'PRI' ? h('span', { className: 'pk-badge' }, 'PRIMARY') : String(c.Key || '')),
        h('td', {}, c.Default === null ? h('span', { className: 'null-val' }, 'null') : String(c.Default)),
        h('td', {}, String(c.Extra || '')));
}

function showTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    document.getElementById('filterBar').hidden = tab === 'schema';
    if (tab === 'schema') {
        const head = h('thead', {}, h('tr', {}, SCHEMA_HEADINGS.map(heading => h('th', {}, heading))));
        const body = h('tbody', {}, currentSchema.map(schemaRow));
        document.getElementById('gridWrapper').replaceChildren(h('div', { className: 'schema-view' }, h('table', {}, head, body)));
        document.getElementById('pagination').replaceChildren();
    } else {
        loadRows();
    }
}

/* ─── Forms ─────────────────────────────────────────────────────── */

function getInputType(t) {
    t = t.toLowerCase();
    if (t.includes('tinyint(1)')) return 'checkbox';
    if (t.includes('int') || t.includes('float') || t.includes('double') || t.includes('decimal')) return 'number';
    if (t === 'date') return 'date';
    if (t.includes('datetime') || t.includes('timestamp')) return 'datetime-local';
    if (t.includes('json') || t.includes('text') || t.includes('blob')) return 'textarea';
    if (t.startsWith('enum')) return 'enum';
    return 'text';
}
function getEnumValues(t) {
    const m = t.match(/enum\((.+)\)/i);
    if (!m) return [];
    return m[1].split(',').map(v => v.trim().replace(/^'|'$/g, ''));
}

function fieldValue(column, row) {
    if (!row) return column.Default || '';
    return row[column.Field] != null ? row[column.Field] : '';
}

function buildInput(column, value, inputId) {
    const common = { id: inputId, dataset: { col: column.Field } };
    switch (getInputType(column.Type)) {
        case 'checkbox':
            return h('input', { ...common, type: 'checkbox', checked: value == 1 });
        case 'textarea':
            return h('textarea', { ...common, spellcheck: false, value: typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value) });
        case 'enum':
            return h('select', common, getEnumValues(column.Type).map(v => h('option', { value: v, selected: v === String(value) }, v)));
        default:
            return h('input', { ...common, type: getInputType(column.Type), value: String(value) });
    }
}

function buildField(column, row) {
    const inputId = 'field-' + String(column.Field).replace(/[^a-zA-Z0-9_-]/g, '-');
    const isAutoIncrement = Boolean(column.Extra && column.Extra.includes('auto_increment'));
    const control = isAutoIncrement && !row
        ? h('div', {}, h('span', { className: 'auto-tag' }, 'auto increment'))
        : buildInput(column, fieldValue(column, row), inputId);
    return h('div', { className: 'form-group' },
        h('label', { htmlFor: inputId }, String(column.Field) + ' ', h('span', { className: 'type-hint' }, String(column.Type))),
        control);
}

function buildForm(row) {
    return currentSchema.map(column => buildField(column, row));
}

function collectFormData() {
    const d = {};
    document.querySelectorAll('.modal [data-col]').forEach(el => {
        const c = el.dataset.col;
        if (el.type === 'checkbox') d[c] = el.checked ? 1 : 0;
        else if (el.value !== '') d[c] = el.value;
    });
    return d;
}

/* ─── Modals ────────────────────────────────────────────────────── */

let modalTrigger = null;

function modalButton(label, className, action) {
    return h('button', { className, dataset: { action } }, label);
}

function tableTitle(prefix) {
    return [prefix + ' ', h('span', { className: 'mono' }, String(currentTable))];
}

function openModal({ title, body, footer, narrow = false }) {
    modalTrigger = document.activeElement;
    const closeButton = h('button', { className: 'modal-close', 'aria-label': 'Close', dataset: { action: 'close-modal' } }, svg(ICONS.close));
    const dialog = h('div', { className: 'modal' + (narrow ? ' narrow' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title' },
        h('div', { className: 'modal-header' }, h('h2', { id: 'modal-title' }, title), closeButton),
        h('div', { className: 'modal-body' }, body),
        h('div', { className: 'modal-footer' }, footer));
    document.body.appendChild(h('div', { className: 'modal-overlay' }, dialog));
    const first = document.querySelector('.modal-body input:not([type=checkbox]), .modal-body textarea, .modal-body select');
    if (first) first.focus();
}

let editingRow = null;
function openAddModal() {
    editingRow = null;
    openModal({
        title: tableTitle('Add row'),
        body: buildForm(null),
        footer: [modalButton('Cancel', 'btn btn-ghost', 'close-modal'), modalButton('Insert row', 'btn btn-primary', 'submit-add')],
    });
}
function openEditModal(row) {
    editingRow = row;
    openModal({
        title: tableTitle('Edit row'),
        body: buildForm(row),
        footer: [modalButton('Cancel', 'btn btn-ghost', 'close-modal'), modalButton('Save changes', 'btn btn-primary', 'submit-edit')],
    });
}
function closeModal() {
    const o = document.querySelector('.modal-overlay');
    if (o) o.remove();
    editingRow = null;
    if (modalTrigger && document.contains(modalTrigger)) modalTrigger.focus();
    modalTrigger = null;
}

let pendingDelete = null;
function confirmDelete(row) {
    if (!currentPK) { toast('This table has no primary key', 'error'); return; }
    pendingDelete = row;
    openModal({
        title: 'Delete row',
        body: h('div', { className: 'confirm-text' },
            'This permanently removes the row where ',
            h('strong', {}, String(currentPK) + ' = ' + String(row[currentPK])),
            '. This cannot be undone.'),
        footer: [modalButton('Cancel', 'btn btn-ghost', 'close-modal'), modalButton('Delete row', 'btn-danger-solid', 'execute-delete')],
        narrow: true,
    });
}
async function executeDelete() {
    const row = pendingDelete;
    pendingDelete = null;
    closeModal();
    if (!row) return;
    try {
        await api('/api/tables/' + encodeURIComponent(currentTable) + '/rows', { method: 'DELETE', body: JSON.stringify({ pk: currentPK, pkValue: row[currentPK] }) });
        toast('Row deleted');
        loadRows();
    } catch (e) { /* api() already reports a safe, deduplicated error. */ }
}

async function submitAdd() {
    const d = collectFormData();
    try {
        await api('/api/tables/' + encodeURIComponent(currentTable) + '/rows', { method: 'POST', body: JSON.stringify(d) });
        toast('Row inserted');
        closeModal();
        loadRows();
    } catch (e) { /* api() already reports a safe, deduplicated error. */ }
}

async function submitEditCurrent() {
    if (!editingRow || !currentPK) return;
    const d = collectFormData();
    try {
        await api('/api/tables/' + encodeURIComponent(currentTable) + '/rows', { method: 'PUT', body: JSON.stringify({ pk: currentPK, pkValue: editingRow[currentPK], data: d }) });
        toast('Row updated');
        closeModal();
        loadRows();
    } catch (e) { /* api() already reports a safe, deduplicated error. */ }
}

/* ─── Event wiring (no inline handlers: CSP forbids them) ───────── */

const rowAt = el => currentRows[Number(el.dataset.rowIndex)];

const CLICK_ACTIONS = {
    'toggle-sidebar': () => toggleSidebar(),
    'show-tab': el => showTab(el.dataset.tab, el),
    'add-row': () => openAddModal(),
    'apply-filter': () => applyFilter(),
    'clear-filter': () => clearFilter(),
    'sort': el => sortBy(currentSchema[Number(el.dataset.colIndex)].Field),
    'edit-row': el => openEditModal(rowAt(el)),
    'delete-row': el => confirmDelete(rowAt(el)),
    'go-page': el => goPage(Number(el.dataset.page)),
    'close-modal': () => closeModal(),
    'submit-add': () => submitAdd(),
    'submit-edit': () => submitEditCurrent(),
    'execute-delete': () => executeDelete(),
};

document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('modal-overlay')) { closeModal(); return; }
    const el = e.target.closest('[data-action]');
    const handler = el && CLICK_ACTIONS[el.dataset.action];
    if (handler && !el.disabled) handler(el, e);
});

document.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.action === 'per-page') changePerPage(e.target.value);
});

document.getElementById('tableSearch').addEventListener('input', debounce(filterTables, 80));

document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'filterVal') { applyFilter(); return; }
    const modal = document.querySelector('.modal');
    if (!modal) return;
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key !== 'Tab') return;
    const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

loadTables();
})();
</script>
</body>
</html>
