name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and validate version from tag
        id: version
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not a valid version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          {
            echo "VERSION=$VERSION"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # A v* tag can be pushed on any commit: only commits already on main are released.
      - name: Check the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${auth_header}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG_NAME' points to $GITHUB_SHA, which is not on main: merge it into main before tagging"
            exit 1
          fi

      # fxmanifest.lua is the single source of the version (ORM.version and
      # the docs label read it): the tag must match what is committed.
      - name: Check committed version matches the tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          grep -Fxq "fx_version 'cerulean'" fxmanifest.lua
          if ! grep -Fxq "version '${VERSION}'" fxmanifest.lua; then
            echo "::error file=fxmanifest.lua::fxmanifest.lua says $(grep -E "^version '" fxmanifest.lua), tag is ${TAG_NAME}: commit the version bump before tagging"
            exit 1
          fi
          if ! grep -Fq "## [${VERSION}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Package release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          shopt -s globstar nullglob
          PACKAGE_DIR=release/orvexorm
          mkdir -p "$PACKAGE_DIR"
          cp -r core/ database/ utils/ lib/ "$PACKAGE_DIR/"
          cp fxmanifest.lua studio.html README.md LICENSE "$PACKAGE_DIR/"

          # Every path or glob quoted in fxmanifest.lua must resolve inside the package.
          missing=0
          while IFS= read -r entry; do
            # shellcheck disable=SC2206 # $entry is expanded on purpose: it may be a glob
            matches=("$PACKAGE_DIR"/$entry)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::fxmanifest.lua references '$entry' but the package does not contain it"
              missing=1
            fi
          done < <(grep -oE "'[^']+\.(lua|html|json|sql)'" fxmanifest.lua | tr -d "'")
          test -f "$PACKAGE_DIR/lib/import.lua"
          test -f "$PACKAGE_DIR/studio.html"
          [ "$missing" -eq 0 ]

          (cd release && zip -r "../orvexorm-${VERSION}.zip" orvexorm/)

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          # Quoted heredoc and printf: commit subjects and the version are
          # written as data, never expanded by the shell.
          {
            printf '## OrvexORM v%s\n\n### Installation\n' "$VERSION"
            printf '1. Telecharge `orvexorm-%s.zip`\n' "$VERSION"
            cat <<'NOTES'
          2. Extrait dans `resources/` de ton serveur FiveM
          3. `ensure orvexorm` dans ton `server.cfg`

          ### Changements
          NOTES
            printf '%s\n' "$CHANGES"
          } > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: orvexorm-${{ steps.version.outputs.VERSION }}.zip
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
